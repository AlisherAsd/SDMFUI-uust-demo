services:
  layout-service-postgres:
    image: postgres:18.1-bookworm
    container_name: layout-service-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  layout-service-migrate:
    image: migrate/migrate
    container_name: layout-service-migrate
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./backend-services/migrations:/migrations
    command:
      [
        "-path",
        "./migrations",
        "-database",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@layout-service-postgres:5432/${POSTGRES_DB}?sslmode=disable",
        "up",
      ]
    depends_on:
      layout-service-postgres:
        condition: service_healthy

  layout-service-app:
    build:
      context: ./backend-services/layout-service
      dockerfile: Dockerfile
    container_name: layout-service-app
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "8080:8080"

  items-list-service-app:
    build:
      context: ./backend-services/items-list-service
      dockerfile: Dockerfile
    container_name: items-list-service-app
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "8082:8082"

  bff-service-app:
    build:
      context: ./backend-services/bff-service
      dockerfile: Dockerfile
    container_name: bff-service-app
    ports:
      - "8081:8081"
  shell-mf:
    build:
      context: ./frontend-widgets/shell
      dockerfile: Dockerfile
    ports:
      - "5173:5173"

  header-mf:
    build:
      context: ./frontend-widgets/header-mf
      dockerfile: Dockerfile
    ports:
      - "5001:5001"

  footer-mf:
    build:
      context: ./frontend-widgets/footer-mf
      dockerfile: Dockerfile
    ports:
      - "5002:5002"

  items-list-mf:
    build:
      context: ./frontend-widgets/items-list-mf
      dockerfile: Dockerfile
    ports:
      - "5003:5003"

  advertising-widget-mf:
    build:
      context: ./frontend-widgets/advertising-widget-mf
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
