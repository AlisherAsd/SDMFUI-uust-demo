services:
  layout-service-postgres:
    image: postgres:18.1-bookworm
    container_name: layout-service-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  layout-service-migrate:
    image: migrate/migrate
    container_name: layout-service-migrate
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path",
        "./migrations",
        "-database",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@layout-service-postgres:5432/${POSTGRES_DB}?sslmode=disable",
        "up",
      ]
    depends_on:
      layout-service-postgres:
        condition: service_healthy

  layout-service-app:
    build:
      context: ./layout-service
      dockerfile: Dockerfile
    container_name: layout-service-app
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "8080:8080"

  items-list-service-app:
    build:
      context: ./items-list-service
      dockerfile: Dockerfile
    container_name: items-list-service-app
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "8082:8082"

  bff-service-app:
    build:
      context: ./bff-service
      dockerfile: Dockerfile
    container_name: bff-service-app
    ports:
      - "8081:8081"
